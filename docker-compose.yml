# Local stack: `docker compose up --build`, then open http://localhost:5173
# For hot-reload development, run only the databases (`docker compose up postgres redis`)
# and start the apps with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      # Host ports can be changed if they are already taken, e.g. POSTGRES_PORT=5433.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://quiz:quiz@postgres:5432/quiz?schema=public
      REDIS_URL: redis://redis:6379
      # To play from phones on the same Wi-Fi: LAN_HOST=<your computer's IP> docker compose up --build
      CORS_ORIGINS: http://${LAN_HOST:-localhost}:5173,http://localhost:5173
      UPLOAD_DIR: /data/uploads
      # The web container passes /api, /socket.io and /uploads through, so everything is on :5173.
      PUBLIC_API_URL: ${PUBLIC_URL:-http://${LAN_HOST:-localhost}:5173}
      PUBLIC_WEB_URL: ${PUBLIC_URL:-http://${LAN_HOST:-localhost}:5173}
      # Real client addresses come from the web container's X-Forwarded-For.
      TRUST_PROXY: 'true'
      # Signs login tokens. Set your own (32+ characters) for any real deployment.
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      # Comma-separated admin emails; with RESTRICT_QUIZ_EDITING=true only they can create or change quizzes.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESTRICT_QUIZ_EDITING: ${RESTRICT_QUIZ_EDITING:-false}
      # Password reset mail; without SMTP_URL reset links are printed in the api log.
      SMTP_URL: ${SMTP_URL:-}
    ports:
      - '3000:3000'
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty: the browser calls the API on the address it opened the app from.
        VITE_API_URL: ''
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  uploads:
