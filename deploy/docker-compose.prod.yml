# Production: one server, one domain, HTTPS. See deploy/README.md.
#   cd deploy && cp .env.example .env && (edit .env) && docker compose -f docker-compose.prod.yml up -d --build
name: agula-quiz

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: quiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://quiz:${POSTGRES_PASSWORD}@postgres:5432/quiz?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env}
      PUBLIC_API_URL: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: 'true'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESTRICT_QUIZ_EDITING: ${RESTRICT_QUIZ_EDITING:-true}
      PUBLIC_WEB_URL: https://${DOMAIN}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Agula Quiz <no-reply@agula.mn>}
      PORTAL_SSO_SECRET: ${PORTAL_SSO_SECRET:-}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q "\"status\":\"ok\""']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  # Daily database dumps into deploy/backups, kept for BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # Health check every minute; alerts on Slack/Discord/Mattermost webhook and/or Telegram.
  monitor:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    user: root
    entrypoint: ['/bin/sh', '/monitor.sh']
    environment:
      DOMAIN: ${DOMAIN}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./monitor.sh:/monitor.sh:ro
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
