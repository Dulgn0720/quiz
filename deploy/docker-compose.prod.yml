# Production: one server, one domain, HTTPS. See deploy/README.md.
#   cd deploy && cp .env.example .env && (edit .env) && docker compose -f docker-compose.prod.yml up -d --build
name: agula-quiz

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: quiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://quiz:${POSTGRES_PASSWORD}@postgres:5432/quiz?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://${DOMAIN:?set DOMAIN in deploy/.env}
      PUBLIC_API_URL: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: 'true'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESTRICT_QUIZ_EDITING: ${RESTRICT_QUIZ_EDITING:-true}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
  uploads:
  caddy-data:
  caddy-config:
