# Agula Quiz inside the employee portal, at https://<PORTAL_HOST>/quiz/ (no separate domain).
# See deploy/portal/README.md.
#   cd deploy/portal && cp .env.example .env && (edit .env) && docker compose -f docker-compose.portal.yml up -d --build
name: agula-quiz-portal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/portal/.env}
      POSTGRES_DB: quiz
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quiz -d quiz']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # A release bundle ships this image ready-made (see make-bundle.sh); otherwise it is built here.
    image: agula-quiz-api:${QUIZ_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://quiz:${POSTGRES_PASSWORD}@postgres:5432/quiz?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: https://${PORTAL_HOST:?set PORTAL_HOST in deploy/portal/.env}
      PUBLIC_API_URL: https://${PORTAL_HOST}${QUIZ_PATH:-/quiz}
      PUBLIC_WEB_URL: https://${PORTAL_HOST}${QUIZ_PATH:-/quiz}
      UPLOAD_DIR: /data/uploads
      TRUST_PROXY: 'true'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in deploy/portal/.env}
      PORTAL_SSO_SECRET: ${PORTAL_SSO_SECRET:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      RESTRICT_QUIZ_EDITING: ${RESTRICT_QUIZ_EDITING:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Agula Quiz <no-reply@agula.mn>}
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/health | grep -q "\"status\":\"ok\""']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: agula-quiz-web:${QUIZ_VERSION:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        # The app is built for its place on the portal: pages under /quiz/, API at /quiz/api.
        VITE_BASE_PATH: ${QUIZ_PATH:-/quiz}/
        VITE_API_URL: ${QUIZ_PATH:-/quiz}
    restart: unless-stopped
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ../backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Only the portal's web server on this machine should reach it.
      - '127.0.0.1:${QUIZ_PORT:-8090}:80'
    environment:
      PORTAL_ORIGIN: https://${PORTAL_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  postgres-data:
  redis-data:
  uploads:
