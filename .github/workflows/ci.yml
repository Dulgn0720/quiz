name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
          POSTGRES_DB: quiz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quiz:quiz@localhost:5432/quiz?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Build shared package
        run: pnpm build:shared
      - name: Typecheck
        run: pnpm -r --no-bail typecheck
      - name: Unit tests
        run: pnpm -r --no-bail test
      - name: Build
        run: pnpm build
      - name: Migrate database
        run: pnpm --filter @quiz/api prisma:deploy
      - name: End-to-end tests
        run: pnpm --filter @quiz/api test:e2e
