server {
  listen 80;
  root /usr/share/nginx/html;

  # API, live games and uploaded images go to the api container, so the whole app is served from
  # one address (one port to open, one tunnel to share). Resolved per request through Docker's DNS,
  # so nginx still starts when there is no api container (behind the deploy gateway these paths
  # never reach nginx).
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api http://api:3000;

  location ~ ^/(api|uploads)/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 10m;
  }

  location /socket.io/ {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
